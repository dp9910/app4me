  🎯 Key Tone Principles:

  1. Natural Language

  // Instead of: "Problem detected" 
  // Use: "Based on what you shared..."

  // Instead of: "Root cause analysis"
  // Use: "Since you mentioned coffee..."

  // Instead of: "Step 1: Priority"
  // Use: "These might help you understand your patterns"

  2. Friendly Suggestions, Not Prescriptions

  const SuggestionCard = ({ apps, reasoning }) => (
    <div className="bg-white rounded-lg p-4 shadow-sm">
      <p className="text-gray-700 mb-3">{reasoning}</p>
      <div className="grid grid-cols-1 gap-3">
        {apps.map(app => (
          <AppCard key={app.id} app={app} />
        ))}
      </div>
      <p className="text-sm text-gray-500 mt-3">
        Of course, what works varies for everyone - see what feels right for you!
      </p>
    </div>
  );

